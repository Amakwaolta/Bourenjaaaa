<SCRIPT type="text/javascript"><!--

/* ===== 旧セーブ関数（互換用・呪文方式） ===== */
function save2(){
  var s=GameSave("0"),h="";
  if(s!=''){document.getElementById("bun").value=s;h='Get OK';}else{h='Error';}
  document.getElementById("pass").innerHTML=h;
}
function load2(){
  document.getElementById("bun").value=document.getElementById("bun").value.replace(/\x0D\x0A|\x0D|\x0A/g,'');
  var s=document.getElementById("bun").value,ret=-1,h="";
  if(s!='') ret=GameLoad(s);
  if(ret!=-1) h='Set OK'; else h='Error';
  document.getElementById("pass").innerHTML=h;
}

/* ===========================================================
   新セーブ機能：暗号化（復活の呪文）を一切使わず、
   ゲーム内のグローバル変数を直接JSONで読み書きする方式。
   Ie()（チート検証）や Ja/checksum 周りのバグを完全に回避できる。
=========================================================== */

var RAW_KEY = 'srModded71_rawsave_';

// セーブ対象の「定数長」配列フィールド（インデックスごとそのままコピー）
var FIELD_ARRAYS = ['Kb','Nb','cc','q','ec','fc','gc','hc','rc','Ja'];
// 単純なスカラー値
var FIELD_SCALARS = ['l','Ob','Qb','sc','tc','uc','wc','DDB','FPSSW','MISTSW'];

// 武器スロット範囲: キャラ装備(t〜t+3) + インベントリ(Cc〜Ec-1)
function weaponSlotRange(){
  // t, Cc, Ec はゲーム本体で定義されているグローバル定数
  var start = t;          // 4
  var end   = Ec;         // 41 (exclusive)
  return [start, end];
}

function spMsg(msg, isErr){
  var el=document.getElementById('sp-msg');
  el.textContent=msg;
  el.style.color=isErr?'#ff6666':'#88ff88';
  clearTimeout(spMsg._t);
  spMsg._t=setTimeout(function(){el.textContent='';},4000);
}

function nowStr(){
  var d=new Date();
  return d.getFullYear()+'/'
    +('0'+(d.getMonth()+1)).slice(-2)+'/'
    +('0'+d.getDate()).slice(-2)+' '
    +('0'+d.getHours()).slice(-2)+':'
    +('0'+d.getMinutes()).slice(-2);
}

function updateSlotInfo(n){
  var el=document.getElementById('info'+n);
  try{
    var raw=localStorage.getItem(RAW_KEY+n);
    if(!raw){el.textContent='--- empty ---';return;}
    var obj=JSON.parse(raw);
    el.textContent='['+(obj.date||'?')+']  Lv'+(obj.data && obj.data.Kb ? obj.data.Kb[0] : '?');
  }catch(e){el.textContent='(corrupt)';}
}

/* 現在のゲーム状態を丸ごとオブジェクト化 */
function captureGameState(){
  var data = {};

  FIELD_ARRAYS.forEach(function(name){
    var arr = window[name];
    if (arr) data[name] = Array.prototype.slice.call(arr, 0, 8); // 安全に8要素まで
  });
  FIELD_SCALARS.forEach(function(name){
    data[name] = window[name];
  });

  // 武器スロット（main, sub1, sub2）をまとめて保存
  var range = weaponSlotRange();
  var s_ = [], ac_ = [], bc_ = [];
  for (var i = range[0]; i < range[1]; i++){
    s_.push(s[i]);
    ac_.push(Ac[i]);
    bc_.push(Bc[i]);
  }
  data.weaponRangeStart = range[0];
  data.s  = s_;
  data.Ac = ac_;
  data.Bc = bc_;

  // ステージクリアフラグ配列(ve)も全部保存
  data.ve = Array.prototype.slice.call(ve, 0, ue);

  return data;
}

/* オブジェクトから現在のゲーム状態へ反映（Ie()等のチェックは一切経由しない）*/
function applyGameState(data){
  FIELD_ARRAYS.forEach(function(name){
    if (!(name in data)) return;
    var src = data[name];
    var dst = window[name];
    if (!dst) return;
    for (var i = 0; i < src.length; i++) dst[i] = src[i];
  });
  FIELD_SCALARS.forEach(function(name){
    if (name in data) window[name] = data[name];
  });

  if (data.s && data.weaponRangeStart !== undefined){
    var start = data.weaponRangeStart;
    for (var i = 0; i < data.s.length; i++){
      s[start+i]  = data.s[i];
      Ac[start+i] = data.Ac[i];
      Bc[start+i] = data.Bc[i];
    }
  }

  if (data.ve){
    for (var i = 0; i < data.ve.length; i++) ve[i] = data.ve[i];
  }

  // チート検証(Ie)を経由せず、見た目の状態だけリフレッシュする
  // ゲームループはそのまま動き続けるので画面が固まらない
  try { Ge(); } catch(e) {}
}

function rawSave(n){
  try{
    var data = captureGameState();
    var obj = { date: nowStr(), data: data };
    localStorage.setItem(RAW_KEY+n, JSON.stringify(obj));
    updateSlotInfo(n);
    spMsg('Slot '+(n+1)+' にセーブしました ✓');
  }catch(e){
    spMsg('セーブ失敗: '+e.message, true);
  }
}

function rawLoad(n){
  try{
    var raw = localStorage.getItem(RAW_KEY+n);
    if (!raw){ spMsg('Slot '+(n+1)+' にデータがありません', true); return; }
    var obj = JSON.parse(raw);
    applyGameState(obj.data);
    spMsg('Slot '+(n+1)+' をロードしました ✓');
  }catch(e){
    spMsg('ロード失敗: '+e.message, true);
  }
}

function rawDel(n){
  if (!confirm('Slot '+(n+1)+' のデータを削除しますか？')) return;
  localStorage.removeItem(RAW_KEY+n);
  updateSlotInfo(n);
  spMsg('Slot '+(n+1)+' を削除しました');
}

/* ===== 最強データ（チェック非依存・直接代入） ===== */
function loadMaxData(){
  if (!confirm('最強データをロードします。\n現在のデータは上書きされます。よろしいですか？')) return;
  try{
    var data = {
      l: 9999999,
      Kb: [150, 0],
      Nb: [300,300,300,300,0,0,0,0],
      Ob: 9999999,
      Qb: 99999999,
      cc: [6, 11, 13, 6],          // Gunner, Hammerer, Wizard, Gunner
      q:  [600,600,600,600],
      ec: [300,300,300,300,0,0,0,0], // HP振り
      fc: [300,300,300,300,0,0,0,0], // AT振り
      gc: [0,0,0,0,0,0,0,0],         // DEX振り(なし)
      hc: [0,0,0,0,0,0,0,0],         // MAG振り(なし)
      rc: [1,1,1,1],
      sc: 0, tc: 0, uc: 0, wc: 0,
      DDB: 1, FPSSW: 1, MISTSW: 1,
      Ja: [1,0,0,0,0,0,0,0],
      weaponRangeStart: t,
      s:  (function(){ var a=[878,855,1050,878]; var pad=Ec-t-4; for(var i=0;i<pad;i++) a.push(0); return a; })(),
      Ac: (function(){ var a=[0,0,0,0]; var pad=Ec-t-4; for(var i=0;i<pad;i++) a.push(0); return a; })(),
      Bc: (function(){ var a=[0,0,0,0]; var pad=Ec-t-4; for(var i=0;i<pad;i++) a.push(0); return a; })(),
      ve: (function(){ var a=[3,1]; while(a.length<ue) a.push(0); return a; })()
    };
    applyGameState(data);
    spMsg('⚡ 最強データをロードしました！');
  }catch(e){
    spMsg('最強データのロード失敗: '+e.message, true);
  }
}

window.addEventListener('load', function(){
  for (var i = 0; i < 3; i++) updateSlotInfo(i);
});

--></SCRIPT>
