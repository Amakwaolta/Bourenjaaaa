<!DOCTYPE html>

<head>
<title>Stick Ranger Modded</title>
<style>
table, th, td {border: 0.01px solid black;}

/* セーブUIスタイル */
#save-panel {
  margin: 6px auto;
  display: block;
  width: 512px;
  background: #1a1a2e;
  border: 2px solid #4a4a8a;
  border-radius: 8px;
  padding: 8px 12px;
  font-family: MS Gothic, monospace;
  font-size: 10pt;
  color: #e0e0ff;
  box-sizing: border-box;
}
#save-panel .sp-title {
  font-weight: bold;
  color: #aaaaff;
  margin-bottom: 6px;
  font-size: 11pt;
}
#save-panel .sp-row {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-bottom: 4px;
  flex-wrap: wrap;
}
#save-panel .slot-label {
  width: 52px;
  color: #ccccff;
  font-size: 9pt;
  flex-shrink: 0;
}
#save-panel .slot-info {
  flex: 1;
  font-size: 8pt;
  color: #888899;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#save-panel button {
  padding: 2px 10px;
  font-family: MS Gothic, monospace;
  font-size: 9pt;
  cursor: pointer;
  border-radius: 4px;
  border: 1px solid #5555aa;
  flex-shrink: 0;
}
#save-panel .btn-save {
  background: #2a2a6a;
  color: #aaaaff;
}
#save-panel .btn-save:hover { background: #3a3a8a; }
#save-panel .btn-load {
  background: #2a4a2a;
  color: #aaffaa;
}
#save-panel .btn-load:hover { background: #3a6a3a; }
#save-panel .btn-del {
  background: #4a1a1a;
  color: #ffaaaa;
}
#save-panel .btn-del:hover { background: #6a2a2a; }
#save-panel #sp-msg {
  margin-top: 4px;
  font-size: 9pt;
  color: #ffff88;
  min-height: 16px;
}
#save-panel .sp-divider {
  border: none;
  border-top: 1px solid #3a3a6a;
  margin: 5px 0;
}
/* 旧テキストエリア非表示 */
#legacy-save { display:none; }
</style>

<SCRIPT type="text/javascript"><!--

/* ========== 旧セーブ関数（互換用） ========== */
function save2(){
  var s="",h="";
  s=GameSave("0");
  if(s!=''){
    document.getElementById("bun").value=s;
    h='Get OK';
  }else{
    h='Error';
  }
  document.getElementById("pass").innerHTML=h;
}
function load2(){
  document.getElementById("bun").value=document.getElementById("bun").value.replace(/\x0D\x0A|\x0D|\x0A/g,'');
  var s=document.getElementById("bun").value,ret=-1,h="";
  if(s!='') ret=GameLoad(s);
  if(ret!=-1) h='Set OK'; else h='Error';
  document.getElementById("pass").innerHTML=h;
}

/* ========== 新localStorageセーブ機能 ========== */

var LS_KEY = 'srModded71_save_';

function spMsg(msg, isErr) {
  var el = document.getElementById('sp-msg');
  el.textContent = msg;
  el.style.color = isErr ? '#ff6666' : '#88ff88';
  clearTimeout(spMsg._t);
  spMsg._t = setTimeout(function(){ el.textContent = ''; }, 3000);
}

function slotKey(n) { return LS_KEY + n; }

function nowStr() {
  var d = new Date();
  return d.getFullYear() + '/'
    + ('0'+(d.getMonth()+1)).slice(-2) + '/'
    + ('0'+d.getDate()).slice(-2) + ' '
    + ('0'+d.getHours()).slice(-2) + ':'
    + ('0'+d.getMinutes()).slice(-2);
}

function updateSlotInfo(n) {
  var el = document.getElementById('info' + n);
  try {
    var raw = localStorage.getItem(slotKey(n));
    if (!raw) { el.textContent = '--- empty ---'; return; }
    var obj = JSON.parse(raw);
    el.textContent = '[' + (obj.date || '?') + ']  ' + (obj.note || '');
  } catch(e) { el.textContent = '(corrupt)'; }
}

function initSlotInfoAll() {
  for (var i = 0; i < 3; i++) updateSlotInfo(i);
}

function lsSave(n) {
  /* GameSave("0") → ce を取得 */
  var data = GameSave("0");
  if (!data || data === '') {
    /* ゲームがまだ起動していない/タイトル画面ではceが空の場合がある
       その場合は手動でne(0)相当のデータを取れないので警告 */
    spMsg('⚠ ゲームを開始してからSaveしてください', true);
    return;
  }
  var obj = {
    date: nowStr(),
    data: data,
    note: data.substring(0, 12) + '...'
  };
  try {
    localStorage.setItem(slotKey(n), JSON.stringify(obj));
    updateSlotInfo(n);
    spMsg('Slot ' + (n+1) + ' にセーブしました ✓');
  } catch(e) {
    spMsg('セーブ失敗: ' + e.message, true);
  }
}

function lsLoad(n) {
  try {
    var raw = localStorage.getItem(slotKey(n));
    if (!raw) { spMsg('Slot ' + (n+1) + ' にデータがありません', true); return; }
    var obj = JSON.parse(raw);
    var data = obj.data;
    if (!data) { spMsg('データが壊れています', true); return; }

    /* GameLoad は2段階:
       1回目: GameLoad(data) → geにセット, return 0
       2回目: ゲームループのnf()内でhe("")が呼ばれてロード実行
       → ロードをトリガーするためにゲームのリスタートを行う */
    var ret = GameLoad(data);
    if (ret === -1) {
      spMsg('GameLoad拒否 (ret=-1)', true);
      return;
    }
    /* ゲームにリスタートシグナルを送る
       Init()を再呼び出しするとゲームが再起動してhe("")が走る */
    Init("1", 1, 0);
    spMsg('Slot ' + (n+1) + ' からロードしました ✓');
  } catch(e) {
    spMsg('ロード失敗: ' + e.message, true);
  }
}

function lsDel(n) {
  if (!confirm('Slot ' + (n+1) + ' のデータを削除しますか？')) return;
  localStorage.removeItem(slotKey(n));
  updateSlotInfo(n);
  spMsg('Slot ' + (n+1) + ' を削除しました');
}

/* ページ読み込み時にスロット情報を更新 */
window.addEventListener('load', function() {
  initSlotInfoAll();
});

--></SCRIPT>

</body>
