<SCRIPT type="text/javascript"><!--

/* ===== 旧セーブ関数（互換用） ===== */
function save2(){
  var s=GameSave("0"),h="";
  if(s!=''){document.getElementById("bun").value=s;h='Get OK';}else{h='Error';}
  document.getElementById("pass").innerHTML=h;
}
function load2(){
  document.getElementById("bun").value=document.getElementById("bun").value.replace(/\x0D\x0A|\x0D|\x0A/g,'');
  var s=document.getElementById("bun").value,ret=-1,h="";
  if(s!='') ret=GameLoad(s);
  if(ret!=-1) h='Set OK'; else h='Error';
  document.getElementById("pass").innerHTML=h;
}

/* ===========================================================
   直接保存方式
=========================================================== */
var RAW_KEY = 'srModded71_rawsave_';
var FIELD_ARRAYS = ['Kb','Nb','cc','q','ec','fc','gc','hc','rc','Ja'];
var FIELD_SCALARS = ['l','Ob','Qb','sc','tc','uc','wc','DDB','FPSSW','MISTSW'];

function spMsg(msg, isErr){
  var el=document.getElementById('sp-msg');
  el.textContent=msg;
  el.style.color=isErr?'#ff6666':'#88ff88';
}

function nowStr(){
  var d=new Date();
  return d.getFullYear()+'/'+('0'+(d.getMonth()+1)).slice(-2)+'/'+('0'+d.getDate()).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}

function updateSlotInfo(n){
  var el=document.getElementById('info'+n);
  try{
    var raw=localStorage.getItem(RAW_KEY+n);
    if(!raw){el.textContent='--- empty ---';return;}
    var obj=JSON.parse(raw);
    el.textContent='['+(obj.date||'?')+']  Lv'+(obj.data && obj.data.Kb ? obj.data.Kb[0] : '?');
  }catch(e){el.textContent='(corrupt)';}
}

function captureGameState(){
  var data = {};
  FIELD_ARRAYS.forEach(function(name){
    var arr = window[name];
    if (arr) data[name] = Array.prototype.slice.call(arr, 0, 8);
  });
  FIELD_SCALARS.forEach(function(name){ data[name] = window[name]; });
  var start = t, end = Ec;
  var s_=[],ac_=[],bc_=[];
  for (var i=start;i<end;i++){ s_.push(s[i]); ac_.push(Ac[i]); bc_.push(Bc[i]); }
  data.weaponRangeStart = start;
  data.s=s_; data.Ac=ac_; data.Bc=bc_;
  data.ve = Array.prototype.slice.call(ve, 0, ue);
  return data;
}

function applyGameState(data){
  FIELD_ARRAYS.forEach(function(name){
    if (!(name in data)) return;
    var src=data[name], dst=window[name];
    if (!dst) return;
    for (var i=0;i<src.length;i++) dst[i]=src[i];
  });
  FIELD_SCALARS.forEach(function(name){ if (name in data) window[name]=data[name]; });
  if (data.s && data.weaponRangeStart!==undefined){
    var start=data.weaponRangeStart;
    for (var i=0;i<data.s.length;i++){ s[start+i]=data.s[i]; Ac[start+i]=data.Ac[i]; Bc[start+i]=data.Bc[i]; }
  }
  if (data.ve){ for (var i=0;i<data.ve.length;i++) ve[i]=data.ve[i]; }
}

function rawSave(n){
  try{
    var data = captureGameState();
    localStorage.setItem(RAW_KEY+n, JSON.stringify({date:nowStr(),data:data}));
    updateSlotInfo(n);
    spMsg('Slot '+(n+1)+' にセーブしました ✓');
  }catch(e){ spMsg('セーブ失敗: '+e.message, true); }
}

function rawLoad(n){
  try{
    var raw = localStorage.getItem(RAW_KEY+n);
    if (!raw){ spMsg('Slot '+(n+1)+' にデータがありません', true); return; }
    applyGameState(JSON.parse(raw).data);
    spMsg('Slot '+(n+1)+' をロードしました ✓');
  }catch(e){ spMsg('ロード失敗: '+e.message, true); }
}

function rawDel(n){
  if (!confirm('Slot '+(n+1)+' を削除しますか？')) return;
  localStorage.removeItem(RAW_KEY+n);
  updateSlotInfo(n);
  spMsg('Slot '+(n+1)+' を削除しました');
}

/* ===========================================================
   段階的切り分けテスト
   現在のキャラ構成(cc)はそのまま維持し、最小限の差分のみ適用する。
   どのステップで止まるかで原因を特定する。
=========================================================== */
function testStep(n){
  try{
    var msg = '';

    if (n >= 1){
      // ①レベルのみ変更（クラス・武器・ステ振りはそのまま）
      Kb[0] = 150;
      msg += '①Lv150を適用\n';
    }
    if (n >= 2){
      // ②クラスのみ変更（武器・ステ振りは現状のまま）
      cc[0]=6; cc[1]=11; cc[2]=13; cc[3]=6;
      msg += '②クラス変更を適用\n';
    }
    if (n >= 3){
      // ③武器装備（IDのみ。サブ武器は触らない）
      s[t+0]=878; s[t+1]=855; s[t+2]=1050; s[t+3]=878;
      msg += '③武器装備を適用\n';
    }
    if (n >= 4){
      // ④ステータス振り（HP/AT）
      ec[0]=300;ec[1]=300;ec[2]=300;ec[3]=300;
      fc[0]=300;fc[1]=300;fc[2]=300;fc[3]=300;
      gc[0]=0;gc[1]=0;gc[2]=0;gc[3]=0;
      hc[0]=0;hc[1]=0;hc[2]=0;hc[3]=0;
      q[0]=0;q[1]=0;q[2]=0;q[3]=0;
      msg += '④ステ振りを適用\n';
    }
    if (n >= 5){
      // ⑤ゴールド・EXP
      l = 9999999;
      Ob = 9999999;
      msg += '⑤ゴールド/EXPを適用\n';
    }

    spMsg(msg + '→ ここで画面が固まるか確認してください');
  }catch(e){
    spMsg('テスト'+n+'でエラー: '+e.message, true);
  }
}

window.addEventListener('load', function(){
  for (var i=0;i<3;i++) updateSlotInfo(i);
});

--></SCRIPT>
