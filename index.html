<SCRIPT type="text/javascript"><!--

/* ===== 旧セーブ関数（互換用） ===== */
function save2(){
  var s=GameSave("0"),h="";
  if(s!=''){document.getElementById("bun").value=s;h='Get OK';}else{h='Error';}
  document.getElementById("pass").innerHTML=h;
}
function load2(){
  document.getElementById("bun").value=document.getElementById("bun").value.replace(/\x0D\x0A|\x0D|\x0A/g,'');
  var s=document.getElementById("bun").value,ret=-1,h="";
  if(s!='') ret=GameLoad(s);
  if(ret!=-1) h='Set OK'; else h='Error';
  document.getElementById("pass").innerHTML=h;
}

/* ===== localStorageセーブ機能 ===== */
var LS_KEY = 'srModded71_save_';

function spMsg(msg, isErr){
  var el=document.getElementById('sp-msg');
  el.textContent=msg;
  el.style.color=isErr?'#ff6666':'#88ff88';
  clearTimeout(spMsg._t);
  spMsg._t=setTimeout(function(){el.textContent='';},3000);
}

function nowStr(){
  var d=new Date();
  return d.getFullYear()+'/'
    +('0'+(d.getMonth()+1)).slice(-2)+'/'
    +('0'+d.getDate()).slice(-2)+' '
    +('0'+d.getHours()).slice(-2)+':'
    +('0'+d.getMinutes()).slice(-2);
}

function updateSlotInfo(n){
  var el=document.getElementById('info'+n);
  try{
    var raw=localStorage.getItem(LS_KEY+n);
    if(!raw){el.textContent='--- empty ---';return;}
    var obj=JSON.parse(raw);
    el.textContent='['+( obj.date||'?')+']  '+(obj.note||'');
  }catch(e){el.textContent='(corrupt)';}
}

function lsSave(n){
  var data=GameSave("0");
  if(!data||data===''){
    spMsg('⚠ ゲームを開始してからSaveしてください',true);
    return;
  }
  var obj={date:nowStr(),data:data,note:data.substring(0,12)+'...'};
  try{
    localStorage.setItem(LS_KEY+n,JSON.stringify(obj));
    updateSlotInfo(n);
    spMsg('Slot '+(n+1)+' にセーブしました ✓');
  }catch(e){spMsg('セーブ失敗: '+e.message,true);}
}

function lsLoad(n){
  try{
    var raw=localStorage.getItem(LS_KEY+n);
    if(!raw){spMsg('Slot '+(n+1)+' にデータがありません',true);return;}
    var obj=JSON.parse(raw);
    if(!obj.data){spMsg('データが壊れています',true);return;}
    // GameLoad(data)を呼ぶだけでOK
    // 次フレームのnf()→he("")が自動でロードしてくれる
    // Init()の再呼び出しは不要（Neフラグが壊れてゲームが止まる原因だった）
    var ret=GameLoad(obj.data);
    if(ret===-1){spMsg('GameLoad拒否 (ret=-1)',true);return;}
    spMsg('Slot '+(n+1)+' からロードしました ✓ （次フレームで反映）');
  }catch(e){spMsg('ロード失敗: '+e.message,true);}
}

function lsDel(n){
  if(!confirm('Slot '+(n+1)+' のデータを削除しますか？'))return;
  localStorage.removeItem(LS_KEY+n);
  updateSlotInfo(n);
  spMsg('Slot '+(n+1)+' を削除しました');
}

function loadMaxData(){
  if(!confirm('最強データをロードします。\n現在のデータは上書きされます。よろしいですか？'))return;
  var ret=GameLoad(MAX_DATA);
  if(ret===-1){
    spMsg('ロード失敗 (ret=-1)',true);
    return;
  }
  spMsg('⚡ 最強データをロードしました！（次フレームで反映）');
}

window.addEventListener('load',function(){
  for(var i=0;i<3;i++) updateSlotInfo(i);
});
